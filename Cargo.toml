[package]
name = "akami-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
axum = "0.8.9"
base64 = "0.22.1"
bcrypt = "0.19.2"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socketioxide = { version = "0.18.5", features = ["state", "extensions"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_socketio = { version = "0.6.0", features = ["async"] }
